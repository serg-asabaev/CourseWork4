{% extends 'messagesender/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}

<h1>
    Вход
</h1>
<!--{{ product }}-->

<div class="row text-center" style="grid-template-columns: 1fr 1fr 1fr;">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="card col-5">
            <div class="card-body">
                {% csrf_token %}
                {{ form.as_p }}
            </div>
            <button class="btn btn-primary">
                Войти
            </button>
            <a href="{% url 'password_reset' %}">Забыли пароль?</a>
        </div>
    </form>
</div>

{% endblock %}
